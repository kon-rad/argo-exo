# Installed to /etc/secondbrain/bot-repos.toml (root-owned, 644) by install.sh; edits here change nothing until the
# owner reinstalls. The repos the org's bots may branch, push and open PRs in (cli-git). Design: vault
# Areas/argo/second-brain/agent-company/bot-powers-and-shared-memory-design.md section 2.

# The token belongs to the bots' own GitHub account (a machine user, not kon-rad): a classic token with the `repo` and
# `read:org` scopes and never `delete_repo`. What it reaches is set on GitHub: the account is a Write collaborator on
# the repos below and a member of the bots' org, where members may create private repos and only owners may delete.
# Mode 600, owned by hermes; the bots' tool rules deny reading it. The owner creates the account and the token.
token_file = "/home/hermes/.config/bot-github/token"
work_dir = "/home/hermes/cc-work/bots"     # base/<repo> clones, wt/<repo>-<card> worktrees, created-repos.json

# `cli-git repo create <name> --card <card>` (bots with `code`): a private repo in this org, listed in
# work_dir/created-repos.json so `cli-git start` works on it. Empty owner = creation off. There is no delete verb.
[create]
owner = "ArgoOrg"   # the bots' GitHub org (Konrad, 2026-10-21); members create private repos, only owners delete
per_day = 3         # repos the bots may create per UTC day, all bots together

[repos.argo-exo]
github = "kon-rad/argo-exo"
default_branch = "main"
protected = ["main"]
test = ["/home/hermes/.venvs/exo-verify/bin/python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

[repos.secondbrain]
test_on = "mac"          # too heavy for the droplet; `cli-git test` says so and a Mac session runs `test`
github = "kon-rad/secondbrain"
default_branch = "main"
protected = ["main"]
test = ["bash", "-lc", "cd app && npm ci --silent && npx tsc --noEmit -p server && npx vitest run --project web"]
test_timeout_seconds = 1200

[repos.luminalog-oss]
test_on = "mac"          # too heavy for the droplet; `cli-git test` says so and a Mac session runs `test`
github = "kon-rad/luminalog-oss"
default_branch = "main"
protected = ["main"]
test = ["bash", "-lc", "cd web && npm ci --silent && npx tsc --noEmit"]
test_timeout_seconds = 1200

[repos.skillreg]
test_on = "mac"          # too heavy for the droplet; `cli-git test` says so and a Mac session runs `test`
github = "kon-rad/skillreg"
default_branch = "main"
protected = ["main"]
test = ["bash", "-lc", "npm ci --silent && npm test"]
test_timeout_seconds = 900

[repos.m1MaxMonitor]
github = "kon-rad/m1MaxMonitor"
default_branch = "main"
protected = ["main"]
test = ["bash", "-lc", "python3 -m venv .venv && .venv/bin/pip install -q -e '.[dev]' && .venv/bin/python -m pytest -q -p no:cacheprovider"]
test_timeout_seconds = 900

# Public: a bot's branch is public as soon as it's pushed, so the repo's own leak check runs first.
[repos.argo-lifeos]
github = "kon-rad/argo-lifeos"
default_branch = "main"
protected = ["main"]
test = ["bash", "scripts/check-public.sh"]
pre_push = ["bash", "scripts/check-public.sh"]

[repos.konradgnat]
test_on = "mac"          # too heavy for the droplet; `cli-git test` says so and a Mac session runs `test`
github = "kon-rad/konradgnat"
default_branch = "master"
protected = ["master"]
test = ["bash", "-lc", "cd nextjs && npm ci --silent && npx tsc --noEmit"]
test_timeout_seconds = 1200

# Not here on purpose: kon-rad/secondbrain-app (retired 2026-10-16; the app lives in kon-rad/secondbrain).
