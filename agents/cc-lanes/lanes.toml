# Claude Code lanes on the engine board (the Second Brain app's Postgres board, `cli-board`). Read by agents/cc-dispatcher.
#
# A lane is an assignee name on the board; cc-dispatcher claims its ready cards. The description is the lane's job ad.
# The role prompt is <lane>.md next to this file.
# Plan: Areas/argo/argo-exo/plans/10-claude-code-agents.md in the vault.

[dispatcher]
boards = ["exo"]
max_in_progress = 2          # concurrent claude workers; about 3 GB free on the droplet, shared with production
daily_cap = 60               # spawns per day (lanes + the org's 22 bots); the Max plan's limits are shared with the Mac sessions
timezone = "Asia/Tokyo"      # the cap's day rolls at 00:00 here, the same clock as the org's routines (was the droplet's UTC)
poll_seconds = 30
runs_dir = "/home/hermes/cc-runs"        # <task>.jsonl stream logs + state.json
work_dir = "/home/hermes/cc-work"        # git worktrees for lanes with worktree = true
pause_file = "/home/hermes/cc-runs/PAUSE" # touch to stop new spawns; running workers finish
rate_limit_pause_minutes = 60
claude_bin = "/home/hermes/.local/bin/claude"
hermes_bin = "/home/hermes/.local/bin/hermes"
max_attempts = 3             # verify failures before a card is blocked for Konrad

[defaults]
cwd = "/home/hermes/secondBrain"
model = "sonnet"
max_runtime_minutes = 45
permission_mode = "acceptEdits"
allowed_tools = ["Read", "Grep", "Glob", "Edit", "Write",
                 "Bash(git status *)", "Bash(git diff *)", "Bash(git log *)", "Bash(ls *)"]
# Deny wins over allow. The workers run as hermes, so these keep the box's secrets and the trader's signer out.
# Absolute paths need a double slash (//home/...); a single slash is relative to the project and never matched.
denied_tools = ["Bash(sudo *)", "Bash(git push *)", "Bash(ssh *)", "Bash(systemctl *)",
                "Read(**/.env)", "Read(**/.env.*)", "Read(//home/hermes/.hermes/.env)",
                "Read(//home/hermes/.hermes/auth.json)", "Read(//home/hermes/.claude/.credentials.json)",
                "Read(//home/trader/**)", "Read(//srv/exo-guard/**)",
                # The bots' GitHub token and the environment of running processes (cli-git hands the token to git
                # and gh through it); vault bot-powers-and-shared-memory-design.md section 2.
                "Read(//home/hermes/.config/bot-github/**)", "Read(//proc/**)", "Read(//etc/secondbrain/env*)"]

[lanes.cc-coder]
description = "Writes and fixes code in its own git worktree, runs the tests, and leaves a branch for review. Never pushes."
model = "opus"
cwd = "/home/hermes/argo-exo"
worktree = true
max_runtime_minutes = 60
allowed_tools = ["Bash(git add *)", "Bash(git commit *)", "Bash(git checkout *)",
                 "Bash(python3 -m pytest *)", "Bash(/home/hermes/.venvs/exo-verify/bin/python -m pytest *)",
                 "Bash(npm test *)", "Bash(npx vitest *)"]

[lanes.cc-research]
description = "Researches a question from primary sources and writes a vault research note in house style; answers in the task result."
model = "opus"
allowed_tools = ["WebSearch", "WebFetch"]

[lanes.cc-writer]
description = "Drafts and edits vault notes (plans, dev logs, docs) in the vault's house style. No code."
model = "sonnet"

[lanes.cc-reviewer]
description = "Reviews another task's branch, diff or note and comments findings on the task. Never edits or commits."
model = "sonnet"
permission_mode = "default"

# Checks the dispatcher runs after a worker completes a card whose body has `verify: <name>`.
# Commands live only here. "worker" = the worker's cwd (cc-coder: its worktree).
# `lanes` lists the lanes whose cards may name the check; a card on any other lane escalates without running it.
# The interpreter is a venv, not the system python3 (which has no pytest or the repo's deps), and an absolute path
# because the worker env's PATH is minimal. Created at deploy as hermes:
#   python3 -m venv /home/hermes/.venvs/exo-verify && /home/hermes/.venvs/exo-verify/bin/pip install -r requirements-dev.txt
[verifiers.argo-exo-tests]
cmd = ["/home/hermes/.venvs/exo-verify/bin/python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
cwd = "worker"
lanes = ["cc-coder"]
timeout_seconds = 600
metric_regex = "(\\d+) passed"

[verifiers.cc-dispatcher-tests]
cmd = ["/home/hermes/.venvs/exo-verify/bin/python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "agents/cc-dispatcher/tests"]
cwd = "worker"
lanes = ["cc-coder"]
timeout_seconds = 300
metric_regex = "(\\d+) passed"
# The agent company (Areas/argo/second-brain/agent-company/agent-company-design.md §6 in the vault): named agents
# from .agents/org.yaml, woken by the message board (org_wakeups) and by board cards assigned to their names.
# Tools and denies add to [defaults]; an agent's own tools come from org-agents.json; a `lane` adds that lane's.
[org]
enabled = true
vault = "/home/hermes/secondBrain"
agents_file = "/home/hermes/secondBrain/.agents/org/org-agents.json"
skill_file = "/home/hermes/secondBrain/.agents/skills/org-member/SKILL.md"
cli_org = "/home/hermes/.local/bin/cli-org"
timezone = "Asia/Tokyo"
session_reset_days = 3        # was 14: a resumed session re-reads its whole history on every wake (2026-10-19)
bots_work_dir = "/home/hermes/cc-work/bots"   # cli-git worktrees; bots with the code capability get it as --add-dir
max_turns = 60
allowed_tools = ["Bash(cli-org *)", "Bash(cli-projects list*)", "Bash(cli-projects report*)", "Bash(python3 -m pytest *)", "Bash(npx vitest *)"]
# Absolute paths only: the relative "CURRENT/**" also blocked Read on the vault's lowercase Areas/argo/argo-exo/current/
# ("directory denied by your permission settings", lena, card t_66272ae6, 2026-10-16).
denied_tools = ["Read(//home/hermes/secondBrain/CURRENT/**)", "Edit(//home/hermes/secondBrain/CURRENT/**)",
                "Write(//home/hermes/secondBrain/CURRENT/**)"]

