# /etc/asound.conf: the Exo's I2S mic (SPH0641 -> ADAU7002 -> GPIO 18/19/20) as one shared mono device.
#   exomic        what everything opens: push-to-talk (EXO_MIC_DEVICE=exomic), deck-recorder's memos and
#                 video sound. plug converts to whatever rate/format each reader asks for.
#   exomic_left   takes the left channel only (the mic's SELECT pin is tied to GND = left)
#   exomic_snoop  dsnoop, so several readers share the one capture device
# install.sh copies this only once the adau7002 card shows in /proc/asound/cards.
# Card name, format and rate are unverified until the mic is soldered: check `arecord -l` and
# `arecord -D hw:CARD=adau7002 --dump-hw-params -d 1 /dev/null`, then adjust the slave block.
pcm.exomic {
    type plug
    slave.pcm "exomic_left"
}
pcm.exomic_left {
    type route
    slave { pcm "exomic_snoop"; channels 2 }
    ttable.0.0 1
}
pcm.exomic_snoop {
    type dsnoop
    ipc_key 7002
    ipc_perm 0666
    slave {
        pcm "hw:CARD=adau7002,DEV=0"
        channels 2
        rate 48000
        format S32_LE
    }
}
